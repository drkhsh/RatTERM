[package]
name = "icy_term"
version = "0.8.4"
authors.workspace = true
edition.workspace = true
# The default `reticulum` feature links AGPL-3.0-or-later rsReticulum, so the
# distributed binary is AGPL. Built with --no-default-features it is upstream's
# MIT or Apache-2.0. The metadata has to describe what actually ships.
license = "AGPL-3.0-or-later"
description = "A BBS terminal with CP437, PETSCII, Viewdata, RIP, SkyPix, and SyncTERM door graphics/audio"
repository = "https://github.com/drkhsh/RatTERM"

# Rename the binary only; renaming the crate would churn every path on rebase.
[[bin]]
name = "ratterm"
path = "src/main.rs"

[features]
default = ["reticulum"]
# rnsh transport; not available on wasm32, build wasm with --no-default-features.
reticulum = ["dep:rns-runtime", "dep:rns-identity"]

[dependencies]
icy_net = { workspace = true }
rns-runtime = { workspace = true, optional = true }
rns-identity = { workspace = true, optional = true }
icy_engine = { workspace = true }
icy_engine_scripting = { workspace = true }
icy_parser_core = { workspace = true }
mlua = { workspace = true }
icy_ui = { workspace = true, features = ["tokio", "svg", "image", "wgpu"] }

clap-i18n-richformatter = { workspace = true }
image = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
versions = { workspace = true }
regex = { workspace = true }
semver = { workspace = true }
webbrowser = { workspace = true }
icy_engine_gui = { workspace = true }
fastrand = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
md5 = "0.8.0"
schemars = "1.2"

#sound
rodio = { workspace = true }

walkdir = { workspace = true }
toml = { workspace = true }

notify = { workspace = true }
human_bytes = { version = "0.4", default-features = false }

chrono = { workspace = true }      # Utc hanldung
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }

i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
once_cell = { workspace = true }
url = "2.5.8"

log = { workspace = true }
flexi_logger = { workspace = true }

directories = { workspace = true }
open = { workspace = true }
rfd = { workspace = true }

async-recursion = "1.1.1"
async-trait = "0.1"

# MCP (rmcp + HTTP server)
rmcp = { workspace = true, features = ["transport-streamable-http-server"] }
axum = "0.8"
reqwest = { workspace = true }

[build-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
winres = "0.1"

[package.metadata.bundle]
name = "RatTERM"
identifier = "at.drkhsh.ratterm"
icon = ["build/mac/128x128@2x.png"]
resources = []
copyright = "Copyright (c) Mike Krüger 2022, drkhsh 2026"

[package.metadata.deb]
name = "ratterm"
# Without these, cargo-deb takes the maintainer from workspace authors (Mike
# Krüger, who does not maintain this fork's packages) and the extended
# description from the crate README, markdown heading and all.
maintainer = "drkhsh <me@drkhsh.at>"
extended-description = """A BBS terminal supporting CP437, PETSCII, ATASCII, Viewdata, RIPscrip and SkyPix, plus SyncTERM door graphics and audio. This fork of IcyTERM adds a Reticulum (rnsh) connection type for dialling boards published on the Reticulum mesh."""
section = "Network"
copyright = "Copyright (c) Mike Krüger 2022, drkhsh 2026"
revision = ""
depends = "$auto, libasound2"
# Paths follow the renamed binary, not the crate.
assets = [
    [
        "target/release/ratterm",
        "/usr/bin/",
        "755",
    ],
    [
        "build/linux/ratterm.desktop",
        "/usr/share/applications/",
        "644",
    ],
    [
        "build/linux/128x128.png",
        "/usr/share/icons/hicolor/128x128/apps/ratterm.png",
        "644",
    ],
    [
        "build/linux/256x256.png",
        "/usr/share/icons/hicolor/256x256/apps/ratterm.png",
        "644",
    ],
]
