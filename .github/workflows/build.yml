name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # `cargo fmt --all --check` fails on upstream's own tree (icy_engine,
      # icy_draw, icy_mail, icy_view and upstream's rlogin calls), so scope the
      # check to the module this fork owns.
      - name: Check formatting
        run: rustfmt --edition 2021 --check crates/icy_term/src/terminal/reticulum.rs
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libasound2-dev libxcb-shape0-dev libxcb-xfixes0-dev nasm
          git submodule update --init
      - name: Run tests
        run: cargo test --locked --all-features
      - name: Debug smoke build
        run: cargo build --locked -p icy_term

